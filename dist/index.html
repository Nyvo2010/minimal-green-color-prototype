    <script>
      // Handle GitHub Pages SPA redirect from 404.html
      // Check for redirect parameter before React Router initializes
      (function() {
        var redirectParam = new URLSearchParams(window.location.search).get('redirect');
        if (redirectParam) {
          // Replace the URL with the clean path (no redirect param)
          // Use replaceState to avoid adding to history
          var cleanUrl = window.location.pathname + redirectParam;
          window.history.replaceState(null, '', cleanUrl);
        }
      })();
    </script>
