<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    var basePath = '/minimal-green-color-prototype';
    
    // If we're at the root 404, don't redirect
    if (path === basePath + '/404.html' || path === basePath + '/') {
      window.location.replace(basePath + '/');
    } else {
      // Preserve the path but go through index.html
      var cleanPath = path.replace(basePath, '');
      if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
      
      window.location.replace(basePath + '/?redirect=' + encodeURIComponent(cleanPath + search + hash));
    }
  </script>
</head>
<body>
  <p>Redirecting to <a id="link" href="#">home</a>...</p>
  <script>
    var basePath = '/minimal-green-color-prototype';
    document.getElementById('link').href = basePath + '/';
  </script>
</body>
</html>
